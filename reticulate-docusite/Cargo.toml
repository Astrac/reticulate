[package]
name = "reticulate-docusite"
version = "0.1.0"
authors = ["Aldo Stracquadanio <aldo.stracquadanio@siriusxm.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ammonia = { version = "4.2" }
comrak = { version = "0.56", default-features = false, features = ["attributes", "syntect-fancy"] }
dioxus = { version = "0.7.10", features = [ "fullstack", "router"] }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server"]
fullstack = ["dioxus/fullstack"]
