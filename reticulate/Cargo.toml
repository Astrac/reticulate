[package]
name = "reticulate"
version = "0.1.0"
edition = "2024"
description = "A high performance voxel meshing library."
authors.workspace = true
license-file.workspace = true

[lints]
workspace = true

[dependencies]
# TODO: Make this optional under "log" feature
log = "0.4"
bytemuck = "1.25.2"

[dev-dependencies]
criterion = "0.8"
rand = "0.10"
rstest = "0.26"
rstest_reuse = "0.7.0"
spdlog-rs = { version = "0.5", features = ["log"] }

[[bench]]
name = "chunk"
harness = false
