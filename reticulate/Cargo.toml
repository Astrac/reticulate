[package]
name = "reticulate"
version = "0.1.0"
edition = "2024"
description = "A high performance voxel meshing library."
authors.workspace = true
license-file.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck = "1.25"
crossbeam = { version = "0.8", features = ["crossbeam-channel"] }
rayon = "1.12"
# Optional dependencies, feature-controlled
comfy-table = { version = "8.0", optional = true }
log = { version = "0.4", optional = true }
metrics-lib = { version = "1.0", optional = true, features = ["meter"] }

[dev-dependencies]
criterion = "0.8"
rand = "0.10"
rstest = "0.26"
rstest_reuse = "0.7.0"
spdlog-rs = { version = "0.5", features = ["log"] }

[features]
metrics-recording = ["dep:metrics-lib", "dep:comfy-table"]
logging = ["dep:log"]
