[workspace]
members = [
    "reticulate",
    "reticulate-bench",
    "reticulate-bevy",
    "reticulate-demo",
    "reticulate-docusite",
]
resolver = "3"

[workspace.package]
authors = ["Aldo Stracqudanio <aldo.strac@gmail.com>"]
license-file = "LICENSE.md"

[workspace.lints.clippy]
needless_range_loop = "allow"

[profile.bench]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
debug-assertions = false
overflow-checks = false

[profile.dev]
opt-level = 0
debug = "line-tables-only"
debug-assertions = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 0
