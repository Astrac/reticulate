[workspace]
members = [
  "glare",
  "linear-octree",
  "scripts"
]
resolver = "3"

[profile.dev]
opt-level = 0
debug = 2               # Forces full line tables and variable tracking info
debug-assertions = true # Mandated to catch indexing panic paths
panic = "unwind"        # Required for backtrace to trace stack frames cleanly

[profile.dev.package."*"]
opt-level = 0           # Strip optimizations from libraries like bitvec
