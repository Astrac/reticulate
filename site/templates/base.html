<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{{ config.description }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="{{ get_url(path='/') }}">{{ config.title }}</a>
      <a href="{{ get_url(path='/') }}">Home</a>
      <a href="{{ get_url(path='contributing') }}">Contributing</a>
      <a href="{{ get_url(path='license') }}">License</a>
      <a href="{{ get_url(path='demo') }}">Demo</a>
      <a class="right" href="{{ config.extra.repo_url }}">GitHub</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
