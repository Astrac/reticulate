name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - README.md
      - CONTRIBUTING.md
      - LICENSE.md
      - .github/scripts/**
      - .github/workflows/pages.yml
      # The Demo page is built from these.
      - reticulate/**
      - reticulate-bevy/**
      - reticulate-demo/**
      - Cargo.toml
      - Cargo.lock
  pull_request:
    branches: [main]
    paths:
      - site/**
      - README.md
      - CONTRIBUTING.md
      - LICENSE.md
      - .github/scripts/**
      - .github/workflows/pages.yml
      # The Demo page is built from these.
      - reticulate/**
      - reticulate-bevy/**
      - reticulate-demo/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.6"
  BINARYEN_VERSION: "version_129"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen and wasm-opt
        run: |
          # wasm-bindgen must match the version locked in Cargo.lock.
          wb=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, "", $3); print $3; exit}' Cargo.lock)
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${wb}/wasm-bindgen-${wb}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-${wb}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Build the demo (wasm)
        run: .github/scripts/build_demo.sh
      - name: Generate pages from root markdown files
        run: .github/scripts/prepare_site.sh
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name != 'pull_request'
      - name: Build
        working-directory: site
        run: |
          zola build --base-url "${{ steps.pages.outputs.base_url || 'https://example.invalid' }}"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
