name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - README.md
      - CONTRIBUTING.md
      - LICENSE.md
      - .github/scripts/prepare_site.sh
      - .github/workflows/pages.yml
  pull_request:
    branches: [main]
    paths:
      - site/**
      - README.md
      - CONTRIBUTING.md
      - LICENSE.md
      - .github/scripts/prepare_site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.21.0"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Generate pages from root markdown files
        run: .github/scripts/prepare_site.sh
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name != 'pull_request'
      - name: Build
        working-directory: site
        run: |
          zola build --base-url "${{ steps.pages.outputs.base_url || 'https://example.invalid' }}"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
