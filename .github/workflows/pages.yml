name: Pages

on:
  push:
    branches: [main]
    paths: &paths
      - reticulate-docusite/**
      - README.md
      - LICENSE.md
      - .github/scripts/**
      - .github/workflows/pages.yml
      # The demo embedded in the site is built from these.
      - reticulate/**
      - reticulate-bevy/**
      - reticulate-demo/**
      - Cargo.toml
      - Cargo.lock
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BINARYEN_VERSION: "version_129"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen, wasm-opt and dx
        run: |
          # wasm-bindgen and dx must match the versions locked in Cargo.lock.
          locked() {
            awk -v n="$1" '$0 == "name = \"" n "\"" {getline; gsub(/[^0-9.]/, "", $3); print $3; exit}' Cargo.lock
          }
          wb=$(locked wasm-bindgen)
          dx=$(locked dioxus)
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${wb}/wasm-bindgen-${wb}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-${wb}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/dx"
          curl -sSL "https://github.com/DioxusLabs/dioxus/releases/download/v${dx}/dx-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/dx"
          echo "$RUNNER_TEMP/dx" >> "$GITHUB_PATH"
      - name: Build the demo (wasm)
        run: .github/scripts/build_demo.sh demo-dist
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name != 'pull_request'
      - name: Set the site base path
        # Project sites are served from a sub-path (e.g. /reticulate).
        if: github.event_name != 'pull_request' && steps.pages.outputs.base_path != ''
        run: |
          base="${{ steps.pages.outputs.base_path }}"
          sed -i "s#^\[web.app\]#[web.app]\nbase_path = \"${base#/}\"#" reticulate-docusite/Dioxus.toml
      - name: Build the site (SSG)
        # dx starts the server on IP:PORT and pre-renders every static route
        # into the public dir (index.html, readme/, license/).
        env:
          IP: "127.0.0.1"
          PORT: "9991"
        run: dx build -p reticulate-docusite --release --ssg
      - name: Add the demo to the site
        run: |
          public=target/dx/reticulate-docusite/release/web/public
          # The demo snippet loads ./reticulate_bevy*.{js,wasm} and ./assets/
          # relative to the page, so it must sit next to each page that embeds
          # it: / and /readme/.
          for dir in "$public" "$public/readme"; do
            mkdir -p "$dir"
            cp -r demo-dist/. "$dir"
          done
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: target/dx/reticulate-docusite/release/web/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
